name: aidealab - carrosseis (motor novo, nuvem)

# Único workflow de geração de carrossel da aidealab. Roda o motor novo (motor/ = carrossel-engine,
# tema agente aidealab/clientes/aidealab/design-system/tema), sem depender do PC:
#   1. setup-motor.sh (Playwright, rembg, OpenCV 4, fontes do tema)
#   2. claude -p com automation/cloud/daily-carousel-prompt-cloud.txt (gera em
#      agente aidealab/clientes/aidealab/carrosseis/<slug>/, imagens só do banco 02-Materiais-Brutos/img-ref)
#   3. upload_carrosseis.py sobe os rascunhos para Clientes/aidealab/04-Carrosseis (etapa fixa, não o modelo)
# Regra de lote: só gera quando 04 não tem rascunho (aprovar = mover a pasta para 06/FILA).
# Para testar com 04 cheio: Run workflow com forcar = true e qtd = 1.

on:
  schedule:
    - cron: "0 11 * * *"  # 8h BRT
  workflow_dispatch:
    inputs:
      qtd:
        description: "Quantos carrosséis gerar"
        required: true
        default: "3"
      forcar:
        description: "Ignorar a regra de lote (gera mesmo com rascunhos em 04)"
        type: boolean
        default: false

concurrency:
  group: aidealab-criar-post
  cancel-in-progress: false

jobs:
  gerar-carrosseis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache dos modelos do rembg
        uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.rembg
          key: rembg-modelos-v1

      - name: Preparar motor novo
        run: bash "agente aidealab/automation/cloud/setup-motor.sh"

      - name: Instalar Claude Code CLI
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Gerar carrosséis (motor novo)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AIDEALAB_FOLDER_ID: ${{ secrets.AIDEALAB_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          QTD: ${{ inputs.qtd || '3' }}
          FORCAR: ${{ inputs.forcar && '1' || '0' }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "agente aidealab/automation/cloud/_run"
          claude -p "$(cat 'agente aidealab/automation/cloud/daily-carousel-prompt-cloud.txt')" \
            --model claude-sonnet-5-5 \
            --permission-mode dontAsk \
            --permission-prompts none \
            --allowedTools "Read,Write,Edit,Bash,Glob,Grep,Skill" \
            2>&1 | tee "agente aidealab/automation/cloud/_run/log.txt"

      - name: Subir rascunhos para o Drive (04-Carrosseis)
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python "agente aidealab/automation/cloud/upload_carrosseis.py"

      - name: Guardar PNGs e log (mesmo se algo falhar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrosseis-${{ github.run_id }}
          path: |
            agente aidealab/clientes/aidealab/carrosseis/*/png/
            agente aidealab/clientes/aidealab/carrosseis/*/carrossel.json
            agente aidealab/automation/cloud/_run/log.txt
          retention-days: 14
          if-no-files-found: ignore
