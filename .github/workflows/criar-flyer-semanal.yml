name: aidealab - criar-flyer semanal (nuvem)

# Gera 1 flyer novo por semana num runner do GitHub Actions. Mesmo desenho
# da rotina de carrossel (ver criar-post-diario.yml e
# agente aidealab/automation/cloud/README.md) -- Haiku por padrão, saída só
# em `07-Flyer/<slug>/` no Drive, aprovação continua manual.

on:
  # schedule DESATIVADO de propósito até validar a automação de ponta a
  # ponta via workflow_dispatch manual. Reativa descomentando o bloco
  # abaixo depois que um run manual completar sem erro.
  # schedule:
  #   # 08:00 America/Sao_Paulo (UTC-3) toda segunda-feira = 11:00 UTC
  #   - cron: "0 11 * * 1"
  workflow_dispatch: {}

concurrency:
  group: aidealab-criar-flyer
  cancel-in-progress: false

jobs:
  gerar-flyer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências Python (Drive, render-engine, rembg)
        run: |
          pip install -r "agente aidealab/automation/cloud/requirements.txt"
          pip install -r "agente aidealab/skills/criar-post/templates/render-engine/requirements.txt"

      - name: Instalar Chromium do Playwright
        run: playwright install chromium --with-deps

      - name: Instalar pngquant/optipng
        run: sudo apt-get update && sudo apt-get install -y pngquant optipng

      - name: Instalar Claude Code CLI
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Rodar rotina (criar-flyer, 1 peça, modelo Haiku)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AIDEALAB_FOLDER_ID: ${{ secrets.AIDEALAB_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          claude -p "$(cat 'agente aidealab/automation/cloud/weekly-flyer-prompt-cloud.txt')" \
            --model claude-haiku-4-5-20251001 \
            --permission-mode dontAsk \
            --permission-prompts none \
            --allowedTools "Read,Write,Edit,Bash,Glob,Grep" \
            2>&1 | tee "agente aidealab/automation/cloud/_run_log.txt"
          # Sem --bare (só aceita ANTHROPIC_API_KEY, não CLAUDE_CODE_OAUTH_TOKEN).
          # Mesma nota do workflow de carrossel: se as flags de permissão
          # novas derem problema, troque por --dangerously-skip-permissions.

      - name: Upload de segurança (PNG + log, mesmo se algo falhar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criar-flyer-semanal-${{ github.run_id }}
          path: |
            agente aidealab/automation/cloud/_run/
            agente aidealab/automation/cloud/_run_log.txt
          retention-days: 14
          if-no-files-found: ignore
