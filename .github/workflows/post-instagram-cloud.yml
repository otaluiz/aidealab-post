name: post-instagram-cloud

# Única rotina de publicação no Instagram.
on:
  # Agendamento DESATIVADO (postagem manual). Para reativar, descomente.
  # schedule:
  #   # O agendador do GitHub atrasa/descarta execuções, sobretudo em :00 e :30
  #   # (horários mais disputados). Por isso: minutos "quebrados". Alvo: 6h
  #   # America/Cuiaba (UTC-4) = 10:00 UTC; 1a tentativa 10:03 UTC e reservas
  #   # até 21:47 UTC. A guarda de 1 post/dia do publish_next.py torna as
  #   # repetições inofensivas. Nunca antes de 6h.
  #   - cron: "3 10 * * *"
  #   - cron: "17,47 10-21 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Ignorar guarda de 1 post por dia"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (não publica)"
        type: boolean
        default: false
      list_recent:
        description: "Só listar posts recentes (diagnóstico)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r "agente aidealab/skills/post-instagram/scripts/requirements.txt"

      - name: Publish next queue item
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.force_publish }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.list_recent }}" = "true" ]; then ARGS="--list-recent"; fi

          for attempt in 1 2 3; do
            echo "[Attempt $attempt/3]"
            if python "agente aidealab/skills/post-instagram/scripts/publish_next.py" $ARGS; then
              exit 0
            fi
            [ $attempt -lt 3 ] && sleep $((30 * attempt))
          done
          echo "Todas as tentativas falharam"
          exit 1

      - name: Commit updated queue state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "agente aidealab/skills/post-instagram/queue"
          git diff --cached --quiet || git commit -m "chore(post-instagram): mark item as posted [skip ci]"
          git push
