name: aidealab - upload manual de peça pendente pro Drive

# Utilitário avulso: sobe arquivos já renderizados (comitados no repo em
# `agente aidealab/automation/cloud/_pending_upload/<pasta>/`) para uma ou
# duas pastas do Google Drive via drive_helper.py (mesmas credenciais/secrets
# do criar-post-diario.yml / criar-flyer-semanal.yml). Existe porque o MCP
# interativo do Google-Drive não consegue subir binário grande (base64
# inline estoura o orçamento de tokens de saída do modelo) -- ver
# metadata.json dos carrosséis afetados, campo "bloqueio_upload_imagens".
#
# Uso: Actions -> "aidealab - upload manual de peça pendente pro Drive" ->
# Run workflow, preenchendo source_dir e o(s) ID(s) da pasta de destino.
# Depois de confirmar que subiu, remova a pasta de `_pending_upload/` num
# commit separado -- ela não deve ficar permanentemente versionada.

on:
  workflow_dispatch:
    inputs:
      source_dir:
        description: "Pasta no repo com os arquivos a subir (ex: agente aidealab/automation/cloud/_pending_upload/clareza-vende-mais)"
        required: true
      drive_folder_id_1:
        description: "ID da 1a pasta de destino no Drive"
        required: true
      drive_folder_id_2:
        description: "ID da 2a pasta de destino no Drive (deixe vazio pra subir só numa pasta)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do drive_helper
        run: pip install -r "agente aidealab/automation/cloud/requirements.txt"

      - name: Subir cada arquivo para a(s) pasta(s) de destino
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          SRC: ${{ inputs.source_dir }}
          FOLDER1: ${{ inputs.drive_folder_id_1 }}
          FOLDER2: ${{ inputs.drive_folder_id_2 }}
        run: |
          set -euo pipefail
          if [ ! -d "$SRC" ]; then
            echo "ERRO: pasta '$SRC' nao existe no checkout." >&2
            exit 1
          fi
          shopt -s nullglob
          files=("$SRC"/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERRO: pasta '$SRC' esta vazia." >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "== Subindo $f para $FOLDER1 =="
            python "agente aidealab/automation/cloud/drive_helper.py" upload --parent-id "$FOLDER1" --file "$f"
            if [ -n "${FOLDER2:-}" ]; then
              echo "== Subindo $f para $FOLDER2 =="
              python "agente aidealab/automation/cloud/drive_helper.py" upload --parent-id "$FOLDER2" --file "$f"
            fi
          done
