<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1440" />
<title>{{TITULO}}</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  @font-face { font-family: "Inter"; font-weight: 900; src: url(fonts/Inter-900.woff2) format("woff2"); }
  @font-face { font-family: "Manrope"; font-weight: 400; src: url(fonts/manrope-400.woff2) format("woff2"); }
  @font-face { font-family: "Manrope"; font-weight: 600; src: url(fonts/manrope-600.woff2) format("woff2"); }
  @font-face { font-family: "Manrope"; font-weight: 700; src: url(fonts/manrope-700.woff2) format("woff2"); }
  @font-face { font-family: "Yellowtail"; font-weight: 400; src: url(fonts/yellowtail-400.woff2) format("woff2"); }
  @font-face { font-family: "Fira Code"; font-weight: 500; src: url(fonts/fira-code-500.woff2) format("woff2"); }

  /* tokens do tema aidealab (clientes/aidealab/design-system/tema/tema.css) */
  :root { --ink: #0A0E16; --papel: #E9EEF4; --branco: #FFFFFF; --quente: #6EC9F7; --quente-papel: #0B6E9E; --apoio: #E94B91; }
  body { margin: 0; background: var(--ink); }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
  .slide { position: absolute; inset: 0; overflow: hidden; color: var(--branco); font-family: "Manrope", sans-serif; }
  .slide.ink { background: var(--ink); --hot: var(--quente); }
  .slide.papel { background: var(--papel); color: var(--ink); --hot: var(--quente-papel); }

  /* arte aprovada (png) com efeito por cima */
  .foto, .bloom { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 60%; }
  .bloom { filter: blur(22px) brightness(1.4); mix-blend-mode: screen; opacity: 0; }
  .brilho { position: absolute; top: -20%; bottom: -20%; width: 380px; left: -500px; transform: rotate(18deg);
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .16), transparent); mix-blend-mode: screen; }
  .poeira { position: absolute; inset: 0; }
  .poeira i { position: absolute; display: block; border-radius: 50%; background: #cfeeff; }

  /* tipografia animada */
  .led { position: absolute; inset: -40px; background-image: radial-gradient(rgba(110, 201, 247, .16) 1.6px, transparent 1.8px); background-size: 22px 22px; }
  .grade { position: absolute; inset: -60px; background-image: linear-gradient(rgba(46, 82, 184, .09) 1px, transparent 1px), linear-gradient(90deg, rgba(46, 82, 184, .09) 1px, transparent 1px); background-size: 60px 60px; }
  .grao { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; }
  .ink .grao { opacity: .14; } .papel .grao { opacity: .10; }
  .topo, .rodape { position: absolute; left: 72px; right: 72px; display: flex; justify-content: space-between; align-items: center; font: 600 26px "Manrope"; letter-spacing: .04em; }
  .topo { top: 64px; } .rodape { bottom: 64px; }
  .ink .topo, .ink .rodape { text-shadow: 0 2px 14px rgba(0, 0, 0, .45); }
  .dots { display: flex; gap: 10px; align-items: center; }
  .dots i { display: block; width: 10px; height: 10px; border-radius: 5px; background: currentColor; opacity: .5; }
  .dots i.on { width: 34px; background: var(--hot); opacity: 1; }
  .conteudo { position: absolute; left: 72px; right: 72px; top: 200px; bottom: 170px; display: flex; flex-direction: column; justify-content: center; }
  .display { font: 900 120px/0.92 "Inter"; text-transform: uppercase; letter-spacing: -.02em; margin: 0; }
  .display .linha { display: block; overflow: hidden; padding: 0.12em 0 6px; margin-top: -0.12em; }
  .display .lin { display: inline-block; }
  .hot { color: var(--hot); }
  .serif { font: 400 88px/1.05 "Yellowtail"; color: var(--hot); margin: 34px 0 0; }
  .corpo { font: 400 40px/1.35 "Manrope"; max-width: 880px; margin: 40px 0 0; }
  .lista { list-style: none; margin: 56px 0 0; padding: 0; }
  .lista li { display: flex; gap: 34px; align-items: baseline; padding: 28px 0; position: relative; }
  .lista .n { font: 500 34px "Fira Code"; color: var(--apoio); width: 60px; flex: none; }
  .lista .t { font: 700 42px/1.2 "Manrope"; }
  .lista .fio { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: currentColor; opacity: .16; transform-origin: left center; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="ruido"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter>
</svg>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1440" data-duration="{{DURACAO}}">
  {{SLIDES}}
</div>
<script>
  // Motion suave: entra com expo/power3.out, assenta até ~3.5 s e só o ambiente respira até o fim do slide.
  const tl = gsap.timeline({ paused: true });
  const E = "expo.out", S = 6;
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const sobe = (el, t, d = 0.9) => tl.fromTo(el, { y: 30, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: d, ease: "power3.out" }, t);

  document.querySelectorAll(".slide").forEach((sl, k) => {
    const t0 = k * S, q = s => sl.querySelectorAll(s);
    if (sl.classList.contains("png")) {
      // arte aprovada: acende com push-in, brilho varre uma vez, bloom respira, poeira sobe
      tl.fromTo(q(".foto"), { scale: 1.05, filter: "brightness(.4)" }, { scale: 1, filter: "brightness(1)", duration: S, ease: "power2.out" }, t0);
      tl.fromTo(q(".bloom"), { scale: 1.05 }, { scale: 1, duration: S, ease: "power2.out" }, t0);
      tl.fromTo(q(".brilho"), { x: 0 }, { x: 2100, duration: 1.8, ease: "power2.inOut" }, t0 + 1.0);
      if (q(".bloom").length) {
        tl.fromTo(q(".bloom"), { opacity: 0 }, { opacity: .22, duration: 1.4, ease: "sine.out" }, t0 + 0.8);
        tl.to(q(".bloom"), { opacity: .08, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 2 }, t0 + 2.4);
        const p = sl.querySelector(".poeira");
        for (let i = 0; i < 40; i++) {
          const d = document.createElement("i"), r = 1.5 + rnd() * 3;
          Object.assign(d.style, { width: r + "px", height: r + "px", left: rnd() * 1080 + "px", top: 400 + rnd() * 1000 + "px" });
          p.appendChild(d);
          tl.fromTo(d, { y: 0, opacity: 0 }, { y: -(80 + rnd() * 220), x: (rnd() - .5) * 60, opacity: .15 + rnd() * .45, duration: S, ease: "sine.out" }, t0);
        }
      }
      return;
    }
    tl.fromTo(q(".led, .grade"), { scale: 1 }, { scale: 1.06, duration: S, ease: "none" }, t0);
    tl.fromTo(q(".lin"), { yPercent: 105 }, { yPercent: 0, duration: 1.1, ease: E, stagger: 0.12 }, t0 + 0.2);
    q(".sobe").forEach(el => sobe(el, t0 + 1.0, 1));
    q(".lista li").forEach((li, i) => {
      const t = t0 + 1.0 + i * 0.35;
      tl.fromTo(li.querySelector(".n"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, t);
      tl.fromTo(li.querySelector(".t"), { opacity: 0, x: 40, filter: "blur(8px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.9, ease: E }, t + 0.08);
      tl.fromTo(li.querySelector(".fio"), { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: E }, t + 0.15);
    });
  });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
