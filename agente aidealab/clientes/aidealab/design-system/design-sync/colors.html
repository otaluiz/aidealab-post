<!-- @dsCard group="Cores" -->
<title>aidealab — Cores</title>
<style>
  :root {
    --bg: #0D0D12; --surface: #15151d; --border: #2a2a38;
    --text: #F2F2F2; --muted: #9BA3B8;
    --primary: #6EC9F7; --accent: #EB47B4; --accent-2: #FFD980;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-body); padding: 28px;
  }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .chip { width: 100%; height: 56px; border-radius: 7px; margin-bottom: 12px; }
  .role { font-weight: 500; font-size: 13px; }
  .desc { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--muted);
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
</style>
<div class="grid">
  <div class="card">
    <div class="chip" style="background:#6EC9F7"></div>
    <div class="role">Primária</div>
    <div class="desc">Ciano elétrico — headline em destaque, glow</div>
    <div class="hex">#6EC9F7</div>
  </div>
  <div class="card">
    <div class="chip" style="background:#0D0D12; border:1px solid var(--border)"></div>
    <div class="role">Background</div>
    <div class="desc">Navy quase preto — fundo dominante (~85%)</div>
    <div class="hex">#0D0D12</div>
  </div>
  <div class="card">
    <div class="chip" style="background:#EB47B4"></div>
    <div class="role">Accent</div>
    <div class="desc">Fúcsia neon — ênfase no hook, CTA</div>
    <div class="hex">#EB47B4</div>
  </div>
  <div class="card">
    <div class="chip" style="background:#FFD980"></div>
    <div class="role">Accent secundário</div>
    <div class="desc">Dourado/âmbar — uso pontual</div>
    <div class="hex">#FFD980</div>
  </div>
</div>
